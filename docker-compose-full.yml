version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:5.7.29
    container_name: museum-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: likeadmin_java
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    networks:
      - museum-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7.0.4
    container_name: museum-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - museum-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务（Java Spring Boot）
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: museum-backend
    restart: always
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - TZ=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/logs:/app/logs
      - upload_data:/app/uploads
    networks:
      - museum-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 小程序前端（Nginx）
  miniapp:
    build:
      context: ./uniapp
      dockerfile: Dockerfile.miniapp
      args:
        - BUILD_ENV=production
    container_name: museum-miniapp
    restart: always
    ports:
      - "8083:80"
    volumes:
      - ./nginx/miniapp.conf:/etc/nginx/conf.d/default.conf
    networks:
      - museum-network
    depends_on:
      - backend

  # 管理后台（Nginx）
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=production
    container_name: museum-admin
    restart: always
    ports:
      - "8084:80"
    volumes:
      - ./nginx/admin.conf:/etc/nginx/conf.d/default.conf
    networks:
      - museum-network
    depends_on:
      - backend

  # 自动测试服务
  tester:
    build:
      context: ./tests
      dockerfile: Dockerfile
    container_name: museum-tester
    environment:
      - API_BASE_URL=http://backend:8082
      - TEST_MODE=auto
    volumes:
      - ./tests/reports:/app/reports
    networks:
      - museum-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  museum-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  upload_data:
