# 生产配置（入库版）：值全部来自环境变量占位符，无秘密。
# docker-compose-full.yml 注入 MYSQL_HOST/REDIS_HOST 等；真实部署的私有覆盖
# 用 SPRING_CONFIG_ADDITIONAL_LOCATION 挂外部文件，勿把密码写回本文件。
like:
  upload-directory: /app/uploads/

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:likeadmin_java}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
    password:
    database: 0
